name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag: setup-uv publishes no floating major tags. uv itself is
        # pinned to the version that produced uv.lock (same as the Dockerfile).
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.29"
          enable-cache: true

      - name: Set up Python
        run: uv python install  # reads .python-version (3.12.8)

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy opspilot evals

      - name: Test (pytest)
        run: uv run pytest -q

  # [HARNESS:EVAL] Evals in CI: replay only, so every push is graded for $0.
  # WHY: answers come from committed cassettes, so a red build means the harness
  # changed or a prompt drifted. Live evals are manual (eval-live.yml).
  eval-replay:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    env:
      OPSPILOT_MODEL_MODE: replay
      # Empty on purpose: proves replay never needs the network or a key.
      ANTHROPIC_API_KEY: ""
      # Must match the models the cassettes were recorded with -- the model
      # name is part of every cassette key.
      OPSPILOT_MODEL: claude-haiku-4-5
      OPSPILOT_JUDGE_MODEL: claude-sonnet-5
      OPSPILOT_STORE: memory
      COLUMNS: "120"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag: setup-uv publishes no floating major tags. uv itself is
        # pinned to the version that produced uv.lock (same as the Dockerfile).
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.29"
          enable-cache: true

      - name: Set up Python
        run: uv python install  # reads .python-version (3.12.8)

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: "Gate 1: smoke suite (replay, k=3) meets the pass-rate floor"
        run: uv run opspilot eval --suite smoke --k 3 --min-pass-rate 0.75

      - name: "Gate 2: no adversarial regressions vs the committed baseline"
        # Runs even if gate 1 failed, so the build log shows both verdicts.
        if: success() || failure()
        shell: bash
        run: |
          uv run opspilot eval compare evals/baselines/smoke.json latest \
            --fail-on-tag adversarial | tee compare.txt

      - name: Publish report to the job summary
        if: always()
        shell: bash
        run: |
          report="$(ls -t evals/reports/*.md 2>/dev/null | head -1)"
          if [ -n "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f compare.txt ]; then
            { echo; echo "## vs baseline (evals/baselines/smoke.json)"; echo '```'; cat compare.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-smoke
          path: evals/reports/
          if-no-files-found: warn

  # The image Render deploys must build -- and Render only deploys after CI
  # passes (render.yaml: autoDeployTrigger: checksPass), so a broken
  # Dockerfile fails here, not in production.
  docker-build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t opspilot:ci .

      - name: Smoke-test the container (replay, no key, memory store)
        shell: bash
        run: |
          docker run -d --name app -p 10000:10000 -e PORT=10000 \
            -e OPSPILOT_STORE=memory -e OPSPILOT_MODEL=claude-haiku-4-5 opspilot:ci
          for i in $(seq 1 60); do
            curl -sf localhost:10000/healthz && exit 0
            sleep 1
          done
          docker logs app
          exit 1
