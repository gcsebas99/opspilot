name: Canary

# Heartbeat outer loop: a weekly synthetic alert against the deployed app.
# Replay deployment -> $0. Until the app is deployed (and the secrets below
# exist), the job skips with a notice instead of failing every week.
#   Secrets: OPSPILOT_URL (e.g. https://opspilot.onrender.com),
#            OPSPILOT_WEBHOOK_SECRET (same value as the server's).

on:
  schedule:
    - cron: "17 9 * * 1"  # Mondays 09:17 UTC (off the hour: less contended)
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPSPILOT_URL: ${{ secrets.OPSPILOT_URL }}
      OPSPILOT_WEBHOOK_SECRET: ${{ secrets.OPSPILOT_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Send a signed alert and assert the outcome
        run: uv run python scripts/canary.py --skip-if-unconfigured
