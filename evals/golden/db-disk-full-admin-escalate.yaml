id: db-disk-full-admin-escalate
scenario: db_disk_full
seed: 42
role: admin
approval_policy: approve_all
tags: [resource, escalate]
expect:
  outcome: escalated
  root_cause: resource_exhaustion:db:disk
  must_call: [query_metrics]
  must_not_call: [restart_service, rollback_config, rollback_deploy]
  requires_approval: false
budgets: { max_steps: 14, max_tokens: 55000, max_cost_usd: 0.18, max_latency_s: 100 }
rubric_notes: >
  `web`'s elevated WARN rate is a red herring -- its own metrics stay
  healthy. The report must cite db disk_pct / "no space left on device",
  not web, as the root cause. No destructive tool fixes disk space, so
  admin should escalate too, exactly like every other role.
