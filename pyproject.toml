[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot — an incident triage agent for a fake e-commerce stack, built to demonstrate harness engineering."
authors = [
    { name = "gcsebas99", email = "gcsebas99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.13",
    "rich>=13.9",
    "pyyaml>=6.0",
    "tenacity>=9.0",
]

[project.scripts]
opspilot = "opspilot.cli:app"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: typer's `= typer.Option(...)` / `= typer.Argument(...)` default-value pattern is
# the documented way to declare CLI options -- not the mutable-default footgun B008 targets.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["opspilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
